host         : 0.0.0.0
title        : "Zemaneh Yosef/זמני יוסף"
description  : "Use our website to get Halachic times for anywhere in the world, in compliance with the Sepharadi Shita's of Maran Ovadia Yosef, Rabbi Yitzhak Yosef & Rabbi David Yosef"
markdown_ext : "markdown,mkdown,mkdn,mkd,md"

compress_html:
  comments: ["<!-- ", " -->"]

defaults:
  - scope:
      path: "pages"
      type: pages
    values:
      permalink: /:basename:output_ext
      layout: "default"

# Jekyll's defaults, plus the build scripts for older browsers (see _plugins/legacy-browsers.rb)
exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - scripts/
