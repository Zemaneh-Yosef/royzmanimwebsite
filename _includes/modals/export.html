<div class="modal fade" id="exportModal" tabindex="-1" aria-labelledby="exportModalLabel" aria-hidden="true">
	<div class="modal-dialog">
		<div class="modal-content">
			<div class="modal-header">
				<h1 class="modal-title fs-5" id="exportModalLabel">Export Field</h1>
				<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
			</div>
			<div class="modal-body">
				<div class="mb-3" id="export-range">
					<div class="fw-bold mb-2">
						<span class="lang lang-he">טווח תאריכים</span>
						<span class="lang lang-he-Latn">Date range</span>
						<span class="lang lang-en">Date range</span>
					</div>
					<div class="d-flex flex-wrap gap-3">
						<div class="form-outline flex-fill" data-mdb-input-init>
							<input type="text" readonly class="form-control" id="exportrange-start" autocomplete="off">
							<label class="form-label" for="exportrange-start">
								<span class="lang lang-he">התחלה</span>
								<span class="lang lang-he-Latn">Start</span>
								<span class="lang lang-en">Start</span>
							</label>
						</div>
						<div class="form-outline flex-fill" data-mdb-input-init>
							<input type="text" readonly class="form-control" id="exportrange-end" autocomplete="off">
							<label class="form-label" for="exportrange-end">
								<span class="lang lang-he">סיום</span>
								<span class="lang lang-he-Latn">End</span>
								<span class="lang lang-en">End</span>
							</label>
						</div>
					</div>
					<div class="d-flex flex-wrap gap-2 mt-2" id="exportrange-presets">
						<button type="button" class="btn btn-sm btn-outline-primary" data-exportrange-preset="hebrew">
							<span class="lang lang-he">שנה עברית</span>
							<span class="lang lang-he-Latn">Jewish year</span>
							<span class="lang lang-en">Jewish year</span>
						</button>
						<button type="button" class="btn btn-sm btn-outline-primary" data-exportrange-preset="gregorian">
							<span class="lang lang-he">שנה לועזית</span>
							<span class="lang lang-he-Latn">Gregorian year</span>
							<span class="lang lang-en">Gregorian year</span>
						</button>
					</div>
					<p class="small text-body-secondary mt-2 mb-0" id="export-data-note" style="line-height: 1.6"></p>
				</div>
				<div class="mb-3" id="export-progress">
					<div class="progress d-none" id="export-progress-wrap" role="progressbar" aria-label="Export progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
						<div class="progress-bar progress-bar-striped progress-bar-animated" id="export-progress-bar" style="width: 0%"></div>
					</div>
					<div class="small mt-1" id="export-status" aria-live="polite" style="min-height: 1.5em"></div>
				</div>
				<ul class="nav nav-tabs" id="myTab" role="tablist">
					<li class="nav-item" role="presentation">
						<button class="nav-link active" id="export-zmanim-tab" data-bs-toggle="tab" data-bs-target="#export-zmanim-tab-pane" type="button" role="tab" aria-controls="export-zmanim-tab-pane" aria-selected="true">Zemanim Selection</button>
					</li>
					<li class="nav-item" role="presentation">
						<button class="nav-link" id="export-limudim-tab" data-bs-toggle="tab" data-bs-target="#export-limudim-tab-pane" type="button" role="tab" aria-controls="export-limudim-tab-pane" aria-selected="false">Limudim Selection</button>
					</li>
					<li class="nav-item" role="presentation">
						<button class="nav-link" id="export-holidays-tab" data-bs-toggle="tab" data-bs-target="#export-holidays-tab-pane" type="button" role="tab" aria-controls="export-holidays-tab-pane" aria-selected="false">Holiday Selection (ICS only)</button>
					</li>
				</ul>
				<div class="tab-content" id="myTabContent">
					<div class="tab-pane fade show active" id="export-zmanim-tab-pane" role="tabpanel" aria-labelledby="export-zmanim-tab" tabindex="0">
						{% for item in site.data.zmanim %}
							{% if item.shitot %}
							{% for indZman in item.shitot %}
							<div class="form-check">
								<input class="form-check-input" type="checkbox" value="" id="exportzmanid-{{ item.id }}-{{ indZman.id }}" checked>
								<label class="form-check-label" for="exportzmanid-{{ item.id }}-{{ indZman.id }}">
									<span class="lang lang-he">{{ item.names.he }} - {{ indZman.names.he }}</span>
									<span class="lang lang-he-Latn">{{ item.names.he-Latn }} - {{ indZman.names.he-Latn }}</span>
									<span class="lang lang-en">{{ item.names.en }} - {{ indZman.names.en }}</span>
								</label>
							</div>
							{% endfor %}
							{% else %}
							<div class="form-check">
								<input class="form-check-input" type="checkbox" value="" id="exportzmanid-{{ item.id }}" checked>
								<label class="form-check-label" for="exportzmanid-{{ item.id }}">
									<span class="lang lang-he">{{ item.names.he }}</span>
									<span class="lang lang-he-Latn">{{ item.names.he-Latn }}</span>
									<span class="lang lang-en">{{ item.names.en }}</span>
								</label>
							</div>
							{% endif %}
						{% endfor %}
					</div>
					<div class="tab-pane fade" id="export-limudim-tab-pane" role="tabpanel" aria-labelledby="export-zmanim-tab" tabindex="0">
						{% for item in site.data.learning.weekday %}
						<div class="form-check">
							<input class="form-check-input" type="checkbox" value="" id="exportlimudid-{{ item.limud }}" checked>
							<label class="form-check-label" for="exportlimudid-{{ item.limud }}">
								<span class="lang lang-he">{{ item.text.he.full }}</span>
								<span class="lang lang-he-Latn">{{ item.text.he-Latn.full }}</span>
								<span class="lang lang-en">{{ item.text.en.full }}</span>
							</label>
						</div>
						{% endfor %}
					</div>
					<div class="tab-pane fade" id="export-holidays-tab-pane" role="tabpanel" aria-labelledby="export-holidays-tab" tabindex="0">
						<div class="form-check">
							<input class="form-check-input" type="checkbox" value="" id="exporteventid-zmanim" checked>
							<label class="form-check-label" for="exporteventid-zmanim">
								<span class="lang lang-he">הזמנים והלימוד היומיים</span>
								<span class="lang lang-he-Latn">Daily zemanim and learning</span>
								<span class="lang lang-en">Daily zemanim and learning</span>
							</label>
						</div>
						<div class="form-check">
							<input class="form-check-input" type="checkbox" value="" id="exporteventid-hiloulot" checked>
							<label class="form-check-label" for="exporteventid-hiloulot">
								<span class="lang lang-he">הלולות יומי</span>
								<span class="lang lang-he-Latn">Daily Hiloulot</span>
								<span class="lang lang-en">Daily Hiloulot</span>
							</label>
						</div>
						<div class="form-check">
							<input class="form-check-input" type="checkbox" value="" id="exporteventid-levana" checked>
							<label class="form-check-label" for="exporteventid-levana">
								<span class="lang lang-he">קידוש לבנה</span>
								<span class="lang lang-he-Latn">Kiddush Levana</span>
								<span class="lang lang-en">Kiddush Levana</span>
							</label>
						</div>
						<div class="form-check">
							<input class="form-check-input" type="checkbox" value="" id="exporteventid-omer" checked>
							<label class="form-check-label" for="exporteventid-omer">
								<span class="lang lang-he">ספירת העומר</span>
								<span class="lang lang-he-Latn">Sefirath Ha'Omer</span>
								<span class="lang lang-en">Sefirath Ha'Omer</span>
							</label>
						</div>
						<div class="form-check">
							<input class="form-check-input" type="checkbox" value="" id="exporteventid-shabbat" checked>
							<label class="form-check-label" for="exporteventid-shabbat">
								<span class="lang lang-he">שבת</span>
								<span class="lang lang-he-Latn">Shabbat</span>
								<span class="lang lang-en">Shabbat</span>
							</label>
						</div>
						<div class="form-check">
							<input class="form-check-input" type="checkbox" value="" id="exporteventid-yomtov" checked>
							<label class="form-check-label" for="exporteventid-yomtov">
								<span class="lang lang-he">יום טוב (כולל ערב פסח ועירוב תבשילין)</span>
								<span class="lang lang-he-Latn">Yom Tov (with Erev Pesaḥ and Eruv Tavshilin)</span>
								<span class="lang lang-en">Yom Tov (with Erev Passover and Eruv Tavshilin)</span>
							</label>
						</div>
						<div class="form-check">
							<input class="form-check-input" type="checkbox" value="" id="exporteventid-holhamoed" checked>
							<label class="form-check-label" for="exporteventid-holhamoed">
								<span class="lang lang-he">חול המועד</span>
								<span class="lang lang-he-Latn">Ḥol HaMoedh</span>
								<span class="lang lang-en">Intermediate days of Passover and Sukkoth</span>
							</label>
						</div>
						<div class="form-check">
							<input class="form-check-input" type="checkbox" value="" id="exporteventid-hanukka" checked>
							<label class="form-check-label" for="exporteventid-hanukka">
								<span class="lang lang-he">חנוכה</span>
								<span class="lang lang-he-Latn">Ḥanuka</span>
								<span class="lang lang-en">Ḥanuka</span>
							</label>
						</div>
						<div class="form-check">
							<input class="form-check-input" type="checkbox" value="" id="exporteventid-purim" checked>
							<label class="form-check-label" for="exporteventid-purim">
								<span class="lang lang-he">פורים, שושן פורים ופורים משולש</span>
								<span class="lang lang-he-Latn">Purim, Shushan Purim and Purim Meshulash</span>
								<span class="lang lang-en">Purim, Shushan Purim and Purim Meshulash</span>
							</label>
						</div>
						<div class="form-check">
							<input class="form-check-input" type="checkbox" value="" id="exporteventid-minor" checked>
							<label class="form-check-label" for="exporteventid-minor">
								<span class="lang lang-he">ימים מיוחדים (פסח שני, ל"ג בעומר, ט"ו באב, ט"ו בשבט, פורים קטן)</span>
								<span class="lang lang-he-Latn">Minor holidays (Pesaḥ Sheni, Lag Ba'Omer, Tu Be'av, Tu Bishvath, Purim Katan)</span>
								<span class="lang lang-en">Minor holidays (Pesaḥ Sheni, Lag Ba'Omer, Tu Be'av, Tu Bishvath, Purim Katan)</span>
							</label>
						</div>
						<div class="form-check">
							<input class="form-check-input" type="checkbox" value="" id="exporteventid-roshchodesh" checked>
							<label class="form-check-label" for="exporteventid-roshchodesh">
								<span class="lang lang-he">ראש חודש</span>
								<span class="lang lang-he-Latn">Rosh Ḥodesh</span>
								<span class="lang lang-en">Rosh Ḥodesh</span>
							</label>
						</div>
						<div class="form-check">
							<input class="form-check-input" type="checkbox" value="" id="exporteventid-fasts" checked>
							<label class="form-check-label" for="exporteventid-fasts">
								<span class="lang lang-he">תעניות ויום כיפור</span>
								<span class="lang lang-he-Latn">Fasts and Yom Kippur</span>
								<span class="lang lang-en">Fasts and Yom Kippur</span>
							</label>
						</div>
						<div class="form-check">
							<input class="form-check-input" type="checkbox" value="" id="exporteventid-tekufot" checked>
							<label class="form-check-label" for="exporteventid-tekufot">
								<span class="lang lang-he">תקופות</span>
								<span class="lang lang-he-Latn">Tekufoth</span>
								<span class="lang lang-en">Seasons (Tekufoth)</span>
							</label>
						</div>
						<div class="form-check">
							<input class="form-check-input" type="checkbox" value="" id="exporteventid-birkathachama" checked>
							<label class="form-check-label" for="exporteventid-birkathachama">
								<span class="lang lang-he">ברכת החמה</span>
								<span class="lang lang-he-Latn">Birkath Haḥama</span>
								<span class="lang lang-en">Blessing of the Sun</span>
							</label>
						</div>
					</div>
				</div>
			</div>
			<div class="modal-footer">
				<button type="button" class="btn btn-primary" id="downloadModalBtn">
					<i class="bi bi-calendar2-week"></i>
					<span class="lang lang-en">Format as Digital Calendar</span>
					<span class="lang lang-he-Latn">Format as Digital Calendar</span>
					<span class="lang lang-he">הורד לוח שנה דיגיטלי</span>
				</button>
				<button type="button" class="btn btn-primary" id="spreadSheetBtn">
					<img src="/assets/images/download_spread.svg" alt="Download Spreadsheet" style="height: 1em;">
					<span class="lang lang-en">Format as spreadsheet</span>
					<span class="lang lang-he-Latn">Format as spreadsheet</span>
					<span class="lang lang-he">Format as spreadsheet</span>
				</button>
			</div>
		</div>
	</div>
</div>
