		   radii, headings, .fs-sm...) in the same visual proportion as
		   the 1634x842 design canvas on any physical screen resolution.
		   1600 = 16px reference root size x 100 -- assumes html currently
		   computes to 16px; worth confirming in devtools if this or
		   bootstrap.min.css/clock.css set a different root size.
		   min() picks whichever axis (width or height) is more
		   constrained, so nothing overflows even if a future screen's

		font-size: min(calc(1600dvw / 1634), calc(1600dvh / 842));

<script type="module">
	import ZmanSchedule from "/assets/js/shul-wall/zman-schedule.js";

	class ZmanScheduleTable extends ZmanSchedule {

		render() {
			if (!this._data) return;

			// Clear all children except those with data-keep
			for (const child of this.children) {
				if (!child.hasAttribute("data-keep")) child.remove();
			}

			const buildDOM = (obj, parent) => {
				for (const [key, value] of Object.entries(obj)) {
					// Skip CSS variable keys (they should already be removed)
					if (/^var\(--.+\)$/.test(key)) continue;

					const container = document.createElement('div');
					
					if (value && typeof value === 'object' && !Array.isArray(value)) {
						// If it's an object, set its key as the id
						container.id = String(key);
						// Recurse into the nested object
						buildDOM(value, container);
					} else {
						// Leaf node: use data-valueof for the key
						container.setAttribute('data-valueof', String(key));
						// Handle array values by joining
						container.textContent = Array.isArray(value) ? value.join(', ') : String(value);
					}
					
					parent.appendChild(container);
				}
			};

			buildDOM(this._data, this);

			// Run autoschedule if needed
			this.runAutoSchedule();
		}
	}

	customElements.define("zman-schedule-table", ZmanScheduleTable);
	export default ZmanScheduleTable;

</script>
