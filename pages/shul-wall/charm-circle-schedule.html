<link href="/assets/fonts/hadassah/stylesheet.css" rel="stylesheet">
<link id="bs" href="/assets/libraries/bootstrap/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous"/>
<link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Frank+Ruhl+Libre:wght@300..900&display=swap" rel="stylesheet">
<link href="/assets/fonts/sbl/stylesheet.css" rel="stylesheet">

<style>
	html {
		/* Same fluid root size as the live board, so the screenshot
		   matches its proportions on the 1634x842 design canvas. */
		font-size: min(calc(1600dvw / 1634), calc(1600dvh / 842));
	}

	body {
		--bs-body-color: white;
		font-weight: 500;
	}

	/* Static variant is English-only (no page flip) */
	.langTV:not(.lang-en) {
		display: none;
	}

	.centerLeftgrid svg {
		height: 1em;
		width: 1em;
		vertical-align: bottom;
	}

	.centerLeftgrid svg path {
		fill: white;
	}

	.centerLeftgrid {
		display: grid;
		justify-content: center;
		margin-bottom: .5rem;
		font-size: 1.25em;
	}

	zman-schedule .centerLeftgrid {
		font-size: 1.1em;
		margin-bottom: 0;
		margin-top: .85rem;
	}

	.centerLeftgrid > div {
		text-align: left; width: fit-content; line-height: 1;
	}

	.centerLeftgrid i {
		width: 1em;
		text-align: center;
	}

	[data-zfReplace="Haftara"] img {
		height: 1.5ch;
		width: 1.5ch;
		vertical-align: inherit;
	}

	#content {
		background-image: linear-gradient(to bottom, rgba(0,0,0,.95) 0%, transparent 7.5%, transparent 92.5%, rgba(0,0,0,.95) 100%), url("/assets/images/shul-wall/Designer.png");
		background-size: cover;
		background-position-y: 12%;
		width: 100dvw;
		height: 100dvh;
		padding-top: 1.25dvh;
		padding-left: 1rem;
		padding-right: 1rem;
		display: grid;
		grid-template-areas: "title title title"
				"dailyShiurim tefilot weeklyShiurim";
		grid-template-columns: 1fr 1.15fr 1fr;
		grid-template-rows: auto minmax(0, 1fr);
		row-gap: 0.625rem;
		column-gap: 4.8rem;
		font-size: 1.3em;
		font-family: "Barlow", "Hadassah Friedlaender", var(--bs-body-font-family);
		font-weight: 500;
		overflow: hidden;
	}

	article > .langTV:nth-child(1), article > .langTV:nth-child(2) {
		font-weight: bold;
	}

	#content h2 {
		text-align: center;
		font-size: 1.5em;
	}

	#content h1 {
		text-align: center;
		margin-bottom: 0;
		margin-top: 0;
		line-height: 1;
	}

	.schedule-entry-grid {
		display: grid;
		grid-template-columns: 1fr auto;
	}

	.schedule-entry-grid > *:last-child {
		grid-column: 1 / span 2;
	}

	.schedule-entry-grid hr {
		margin: .25rem 0;
	}

	#dailyShiurim  { grid-area: dailyShiurim; }
	#weeklyShiurim { grid-area: weeklyShiurim; }
	#tefilot       { grid-area: tefilot; }

	.templeBG {
		padding: 1.5rem;
		padding-top: 0;
		padding-bottom: 0;
		font-size: 1.75rem;
		min-height: 0;
		height: 100%;
		display: flex;
		flex-direction: column;
	}

	/* Section titles */
	#content .templeBG > h1 {
		font-size: 1.15em;
		font-weight: 700;
		margin-bottom: .4rem;
		flex: 0 0 auto;
	}

	/* Space between the end of the Shabbat block and the weekday title */
	#tefilot > h1 {
		margin-top: 1.25rem;
	}

	/* Schedules take the leftover height. No autoscroll in a screenshot:
	   anything past the card's height is cut off. */
	.templeBG > zman-schedule {
		display: block;
		flex: 1 1 0;
		min-height: 0;
		overflow: hidden;
		--bs-list-group-border-width: 0;
	}

	/* The Shabbat schedule takes only the height it needs, so the
	   weekday schedule starts right where it ends. */
	#tefilot > #shabbatSchCard {
		flex: 0 0 auto;
	}

	.templeBG .list-group {
		font-size: .9em;
	}

	/* Parasha name + Shabbat times, stacked in the title slot */
	#titleArea {
		grid-area: title;
		align-self: center;
		display: flex;
		flex-direction: column;
		align-items: center;
		gap: .75rem;
	}

	#pageTitle {
		text-align: center;
		font-size: 4.65em;
		font-weight: bold;
		line-height: 1;
		margin: 0;
		font-family: "sbl_hebrewregular", var(--bs-body-font-family);
		paint-order: stroke fill;
		-webkit-text-stroke: 3px rgba(0,0,0,.75);
		text-decoration-color: white;
		text-underline-offset: 8px;
	}

	/* Candle lighting and Tzet on one line under the parasha */
	#shabbatTimes {
		display: flex;
		justify-content: center;
		align-items: baseline;
		gap: 2.5em;
		font-size: 1.5rem;
		font-weight: 600;
		line-height: 1;
		white-space: nowrap;
	}

	#shabbatTimes i {
		width: 1em;
		text-align: center;
	}

	#shabbatTimes svg {
		height: 1em;
		width: 1em;
		vertical-align: bottom;
	}

	#shabbatTimes svg path {
		fill: white;
	}

	.list-group-item {
		background: transparent;
	}

	.altTzetMelakhaTime, .fs-sm {
		font-size: .75em;
	}
</style>

<div id="content">
	<div id="titleArea">
		<h1 id="pageTitle"><span data-parasha data-prefix="hb"></span> <img src="/assets/images/shul-wall/charm-circle-logo.png" style="height: 1em; corner-shape: squircle;
    border-radius: 25%;"></h1>
		<div id="shabbatTimes">
			<div data-lightingCandles><i class="bi bi-fire"></i> </div>
			<div data-tzetShab data-rt-text='R"T'><svg viewBox="0 0 108.81511 287.75458" class="flipImageRTL"><use href="/assets/images/havdala.svg#layer1"/></svg></div>
		</div>
	</div>
	<div id="logoPos"></div>

	<div id="dailyShiurim" class="templeBG">
		<h1>
			<span class="langTV lang-hb">שיעורים יומיים</span>
			<span class="langTV lang-en">Daily Shiurim</span>
		</h1>
		<zman-schedule class="list-group list-group-flush" style="line-height: 1.3; font-size: 1.2rem;" id="dailWeekdayCard">
		</zman-schedule>
	</div>

	<div id="tefilot" class="templeBG">
		<zman-schedule class="list-group list-group-flush" style="line-height: 1.3; font-size: 1.425rem;" id="shabbatSchCard">
		</zman-schedule>

		<h1>
			<span class="langTV lang-hb">תפילות ימי חול</span>
			<span class="langTV lang-en">Weekday Schedule</span>
		</h1>
		<zman-schedule class="list-group list-group-flush" style="line-height: 1.3; font-size: 1.425rem;" id="weekdaySchCard">
		</zman-schedule>
	</div>

	<div id="weeklyShiurim" class="templeBG">
		<h1>
			<span class="langTV lang-hb">שיעורי השבוע</span>
			<span class="langTV lang-en">Weekday Shiurim</span>
		</h1>
		<zman-schedule class="list-group list-group-flush" style="line-height: 1.3; font-size: 1.2rem;" id="speWeekdayCard">
		</zman-schedule>
	</div>
</div>

<script id="zy-scheduleScreen-config" type="application/json">
	{{ site.data.tv.config.charm-circle | jsonify }}
</script>
<script>
	/* Same config as the live board, but load next week's schedule.
	   Classic script, so it runs before any module script reads the config. */
	(() => {
		const cfgEl = document.getElementById('zy-scheduleScreen-config');
		const cfg = JSON.parse(cfgEl.textContent);
		cfg.schedule = { ...cfg.schedule, forUpcoming: true };
		cfgEl.textContent = JSON.stringify(cfg);
	})();
</script>

<script type="module" src="/assets/js/shul-wall/reset.js"></script>
<script type="module" src="/assets/js/shul-wall/parasha.js"></script>
<script type="module">
	await import('/assets/js/shul-wall/scheduleOnline.js');

	setTimeout(async () => {
		await import('/assets/js/shul-wall/limud.js');
	}, 2000);
</script>
